name: Pre-release PR

on:
  pull_request:
    branches:
      - "main"
    paths-ignore: # not always respected. See https://github.com/actions/runner/issues/2324#issuecomment-1703345084
      - ".github/**"
      - "**.md"

# creating a separate concurrency group for each PR
# so that our "PR checks" are always running for the latest commit in the PR
# and as PRs are updated we want to make sure "in progress" jobs are killed so we don't waste resources
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Test jobs run third-party tooling on PR code and need no write token.
permissions:
  contents: read

jobs:
  preprod_test:
    name: Pre-prod code testing
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check package version (only X.Y.Z, X.Y.ZbN or X.Y.ZrcN can be released)
        # X.Y.Z releases plus PEP 440 betas and release candidates, for the beta-first v2 release. Alpha, dev, post and
        # local versions stay refused, and the release tag filter in entrypoint_release.yml admits the same shapes.
        # exegol_mcp/__init__.py holds only __version__, so the import needs no dependency.
        run: python3 -c 'import re; from exegol_mcp import __version__ as v; print(v); exit(not re.fullmatch(r"\d+\.\d+\.\d+(?:(?:b|rc)\d+)?", v))'

  code_test:
    name: Python tests and checks
    needs: preprod_test
    # Only this repository's own dev branch skips the gate, because its pushes already ran it. A fork's branch named
    # dev has run nothing here, so it is tested like any other PR.
    if: >-
      github.event.pull_request.head.ref != 'dev' ||
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/sub_testing.yml
