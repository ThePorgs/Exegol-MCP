name: Nightly build

on:
  push:
    branches:
      - "dev"
    #paths:
    #  - "**.py"

# Read-only by default: the build job holds no write token, and only the publish job gets the OIDC token, after the
# tests and the build. The publish job runs no build or project code; it uploads the dist/ the build job produced.
permissions:
  contents: read

jobs:
  test:
    name: Python tests and checks
    uses: ./.github/workflows/sub_testing.yml

  build:
    name: Build Python 🐍 distributions 📦
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
          persist-credentials: false
      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37
        with:
          python-version: "3.12"
      - name: Build Exegol MCP
        run: pdm build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish Python 🐍 distributions to TestPyPI 📦
    runs-on: ubuntu-latest
    environment: nightly
    needs: [test, build]
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: read
    steps:
      # PDM reads the project file to publish; nothing is built or installed in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: false
          persist-credentials: false
      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - name: Publish distribution 📦 to Test PyPI
        run: pdm publish --no-build --repository https://test.pypi.org/legacy/ --skip-existing
